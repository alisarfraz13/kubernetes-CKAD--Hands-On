apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-deployment
  labels:
    app: myapp
    tier: frontend
  annotations:
    kubernetes.io/change-cause: "Nginx image updated to 1.24 for stability patches"
spec:
  replicas: 5
  selector:
    matchLabels:
      app: alnafi-app
  template:
    metadata:
      name: nginx-2
      labels:
        app: alnafi-app
    spec:
      containers:
      - name: nginx-container
        image: nginx:1.24

