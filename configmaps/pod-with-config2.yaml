apiVersion: v1
kind: Pod
metadata:
  name: test-config-pod
spec:
  containers:
  - name: app-container
    image: busybox:stable
    command: ["/bin/sh", "-c"]
    args:
    - |
      echo "--- Testing Mounted File Only ---"
      cat /etc/config/myapp.conf
      sleep 3600
    volumeMounts:
    - name: config-volume
      mountPath: /etc/config
  volumes:
  - name: config-volume
    configMap:
      name: al-nafi-config
