apiVersion: v1
kind: Service
metadata:
  labels:
    app: dashboard
  name: dashboard-service  # 🚨 "dashboard-sv" ko badal kar yeh "dashboard-service" lazmi karein!
  namespace: default
spec:
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 8080
    nodePort: 30842
  selector:
    app: dashboard
  type: NodePort
