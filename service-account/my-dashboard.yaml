apiVersion: v1
kind: Pod
metadata:
  name: my-dashbaordx
  labels:
    app: dashboard
  namespace: default
spec:
  serviceAccountName: dashboard-sa
  containers:
  - name: web-dashboard
    image: gcr.io/kodekloud/customimage/my-kubernetes-dashboard
    ports:
    - containerPort: 8080
      protocol: TCP
    env:
    - name: PYTHONUNBUFFERED
      value: "1"
    - name: SA_TOKEN
      valueFrom:
        secretKeyRef:
          name: dashboard-sa-token
          key: token
